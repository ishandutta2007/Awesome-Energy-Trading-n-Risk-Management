<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-overlay { fill: url(#grid); }
    
    /* Keyframe Animations */
    @keyframes pulseWave {
      0% { transform: translateY(0px) scaleY(1); opacity: 0.5; }
      50% { transform: translateY(-8px) scaleY(1.05); opacity: 0.8; }
      100% { transform: translateY(0px) scaleY(1); opacity: 0.5; }
    }

    @keyframes floatPill {
      0% { transform: translateX(0px); }
      50% { transform: translateX(15px); }
      100% { transform: translateX(0px); }
    }

    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }

    .animated-wave {
      animation: pulseWave 6s ease-in-out infinite;
      transform-origin: center;
    }

    .animated-pill {
      animation: floatPill 8s ease-in-out infinite;
    }

    .candlestick-line {
      stroke-dasharray: 8 4;
      animation: dashMove 3s linear infinite;
    }

    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#textGrad);
      letter-spacing: -0.5px;
    }

    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }

    .badge-tag {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" class="bg" rx="16" />
  <rect width="1200" height="320" class="grid-overlay" rx="16" />

  <!-- Animated Background Dynamics (Graphs & Waves) -->
  <g class="animated-wave" opacity="0.6">
    <!-- Trading Chart Simulation Line (Energy Market Trends) -->
    <path d="M 50 240 Q 200 180 350 220 T 650 140 T 950 180 T 1150 100" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
    <path d="M 50 240 Q 200 180 350 220 T 650 140 T 950 180 T 1150 100 L 1150 280 L 50 280 Z" fill="url(#cyanGlow)" opacity="0.15" />

    <path d="M 50 260 Q 250 210 450 250 T 800 170 T 1150 140" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <path d="M 50 260 Q 250 210 450 250 T 800 170 T 1150 140 L 1150 290 L 50 290 Z" fill="url(#emeraldGlow)" opacity="0.1" />
  </g>

  <!-- Dynamic Animated Floating Pills / Market Metrics (Positioned strictly background/sides) -->
  <g class="animated-pill" opacity="0.4">
    <rect x="920" y="45" width="220" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="940" cy="63" r="6" fill="#10b981" />
    <text x="955" y="68" class="badge-tag">POWER / GAS / OIL ETRM</text>

    <rect x="880" y="240" width="260" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="900" cy="258" r="6" fill="#06b6d4" />
    <text x="915" y="263" class="badge-tag">RISK ANALYTICS & xVA</text>
  </g>

  <!-- Decorative Candlestick Bars in Background -->
  <g opacity="0.25">
    <!-- Candle 1 -->
    <line x1="820" y1="90" x2="820" y2="160" stroke="#10b981" stroke-width="1.5" />
    <rect x="813" y="105" width="14" height="40" fill="#10b981" rx="2" />
    <!-- Candle 2 -->
    <line x1="850" y1="70" x2="850" y2="150" stroke="#ef4444" stroke-width="1.5" />
    <rect x="843" y="85" width="14" height="45" fill="#ef4444" rx="2" />
    <!-- Candle 3 -->
    <line x1="880" y1="110" x2="880" y2="180" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2 2" />
    <rect x="873" y="120" width="14" height="35" fill="#10b981" rx="2" />
  </g>

  <!-- High-Contrast Foreground Content (Always on top) -->
  <g transform="translate(60, 0)">
    <!-- Top Category Pill -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="230" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <text x="16" y="21" font-family="sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="1">
        ⚡ AWESOME ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" class="title-text" filter="url(#glow)">
      Awesome Energy Trading &amp; Risk Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle-text">
      The Curated Guide to SaaS Platforms, Open-Source Risk Engines &amp; Power Systems Modeling
    </text>

    <!-- Key Feature Pills (Foreground Footer) -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="140" height="30" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="14" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🏢 Enterprise SaaS</text>

      <!-- Pill 2 -->
      <rect x="152" y="0" width="155" height="30" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1" />
      <text x="166" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#34d399">🔓 Open-Source Engines</text>

      <!-- Pill 3 -->
      <rect x="319" y="0" width="165" height="30" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1" />
      <text x="333" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#c084fc">📊 Quant Risk &amp; xVA</text>
    </g>
  </g>
</svg>
